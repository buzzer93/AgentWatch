# Surcharge de PRODUCTION.
# Usage : docker compose -f compose.yaml -f compose.prod.yaml up -d
#
# Différences avec le dev :
#   - on construit la cible "frankenphp_prod" (code figé dans l'image, OPcache strict) ;
#   - pas de volume de code monté ;
#   - HTTPS automatique via Caddy (Let's Encrypt) si SERVER_NAME est un vrai domaine.

services:
  php:
    build:
      context: .
      target: frankenphp_prod
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      # Pour activer le HTTPS auto, mets ton domaine ici, ex: SERVER_NAME=agentwatch.example.com
      SERVER_NAME: ${SERVER_NAME:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
